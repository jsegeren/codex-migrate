name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: PYTHONPATH=src python -m compileall -q src
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check CLI
        run: PYTHONPATH=src python -m codex_migrate --version
      - name: Check native Mac shell
        run: xcrun swiftc -typecheck -parse-as-library desktop/CodexMigrate.swift
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test launch email endpoint
        run: node --test tests/signup.test.js
