name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hosted-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v7
      - name: Exercise hosted publication in disposable PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
