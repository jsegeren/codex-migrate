  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: PYTHONPATH=src python -m compileall -q src
      - name: Git probe runtime evidence
        run: |
          # Public toolchain metadata only; no user configuration or credentials.
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin LC_ALL=C /usr/bin/xcrun --find git
          python - <<'PY'
          import os, pathlib, subprocess
          env = {"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "LC_ALL": "C", "HOME": "/var/empty"}
          path = pathlib.Path(subprocess.check_output(["/usr/bin/xcrun", "--find", "git"], env=env, text=True).strip())
          info = path.lstat()
          print({"selected_git": str(path), "resolved_git": str(path.resolve()),
                 "owner_uid": info.st_uid, "mode": oct(info.st_mode), "runner_uid": os.getuid()})
          subprocess.run([str(path), "--version"], env=env, check=True)
          PY
      - name: Provision root-owned Apple Git on disposable CI runner
        run: |
          # Hosted Xcode is runner-owned. Keep the product's root-owner guard;
          # provision only this exact Apple-signed executable for the fixture.
          python - <<'PY'
          import os, pathlib, re, stat, subprocess
          assert os.environ.get("GITHUB_ACTIONS") == "true"
          env = {"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "LC_ALL": "C", "HOME": "/var/empty"}
          path = pathlib.Path(subprocess.check_output(["/usr/bin/xcrun", "--find", "git"], env=env, text=True).strip())
          assert re.fullmatch(r"/Applications/Xcode[^/]*\.app/Contents/Developer/usr/bin/git", str(path))
          assert path.resolve() == path and stat.S_ISREG(path.lstat().st_mode)
          assert not path.lstat().st_mode & 0o022
          subprocess.run(["/usr/bin/codesign", "--verify", "--strict", "-R=anchor apple", str(path)], check=True)
          subprocess.run(["/usr/bin/sudo", "-n", "/usr/sbin/chown", "root:wheel", str(path)], check=True)
          assert path.stat().st_uid == 0
          print("Provisioned the exact Apple-signed Git executable; production guards unchanged.")
          PY
      - name: Exercise Vault Keychain without interactive prompts
        run: |
          xcrun swiftc -parse-as-library -D CODEX_VAULT_TEST_LEGACY_KEYCHAIN desktop/CodexVaultCrypto.swift -o "$RUNNER_TEMP/CodexVaultCryptoSmoke"
          python tests/keychain_ci_smoke.py "$RUNNER_TEMP/CodexVaultCryptoSmoke"
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check CLI
        run: PYTHONPATH=src python -m codex_migrate --version
      - name: Check native Mac shell
        run: |
          python - <<'PY'
          from pathlib import Path
          from desktop.build import sparkle_distribution
          sparkle_distribution(Path("build"))
          PY
          xcrun swiftc -typecheck -parse-as-library -F build/sparkle-2.10.0 desktop/CodexMigrate.swift desktop/UpdateEntitlement.swift desktop/InstallLocation.swift desktop/DuplicateLaunch.swift desktop/SavedSetup.swift
          xcrun swiftc -typecheck -parse-as-library desktop/CodexVaultCrypto.swift
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Test launch email endpoint and shared Help interaction
        run: |
          npm ci --ignore-scripts
          npm test
          node --test tests/r2-live/worker.test.mjs

  vault-portability-export:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vault-portability]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Create synthetic encrypted snapshot on producer Mac
        run: |
          xcrun swiftc -parse-as-library -D CODEX_VAULT_TEST_LEGACY_KEYCHAIN desktop/CodexVaultCrypto.swift -o "$RUNNER_TEMP/CodexVaultCrypto"
          PYTHONPATH=src python tests/portable_vault_roundtrip.py produce "$RUNNER_TEMP/vault-portability" "$RUNNER_TEMP/CodexVaultCrypto"
      - uses: actions/upload-artifact@v4
        with:
          name: vault-portability-synthetic
          path: |
            ${{ runner.temp }}/vault-portability/vault/
            ${{ runner.temp }}/vault-portability/recovery-key.txt
          retention-days: 1
          if-no-files-found: error

  vault-portability-import:
    needs: vault-portability-export
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: vault-portability-synthetic
          path: ${{ runner.temp }}/vault-portability
      - name: Import and restore on independent Mac
        run: |
          xcrun swiftc -parse-as-library -D CODEX_VAULT_TEST_LEGACY_KEYCHAIN desktop/CodexVaultCrypto.swift -o "$RUNNER_TEMP/CodexVaultCrypto"
          PYTHONPATH=src python tests/portable_vault_roundtrip.py consume "$RUNNER_TEMP/vault-portability" "$RUNNER_TEMP/CodexVaultCrypto"

  hosted-portability-export:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[hosted-portability]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stage synthetic encrypted objects on producer Mac
        run: |
          xcrun swiftc -parse-as-library -D CODEX_VAULT_TEST_LEGACY_KEYCHAIN desktop/CodexVaultCrypto.swift -o "$RUNNER_TEMP/CodexVaultCrypto"
          PYTHONPATH=src python tests/portable_hosted_roundtrip.py produce "$RUNNER_TEMP/hosted-portability" "$RUNNER_TEMP/CodexVaultCrypto"
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-portability-synthetic
          path: |
            ${{ runner.temp }}/hosted-portability/encrypted-objects/
            ${{ runner.temp }}/hosted-portability/staged-receipt.json
            ${{ runner.temp }}/hosted-portability/newer-receipt.json
            ${{ runner.temp }}/hosted-portability/recovery-key.txt
            ${{ runner.temp }}/hosted-portability/live-receipt.json
            ${{ runner.temp }}/hosted-portability/live-recovery-key.txt
          retention-days: 1
          if-no-files-found: error

  hosted-portability-import:
    needs: hosted-portability-export
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: hosted-portability-synthetic
          path: ${{ runner.temp }}/hosted-portability
      - name: Import key and recover ciphertext on independent Mac
        run: |
          xcrun swiftc -parse-as-library -D CODEX_VAULT_TEST_LEGACY_KEYCHAIN desktop/CodexVaultCrypto.swift -o "$RUNNER_TEMP/CodexVaultCrypto"
          PYTHONPATH=src python tests/portable_hosted_roundtrip.py consume "$RUNNER_TEMP/hosted-portability" "$RUNNER_TEMP/CodexVaultCrypto"
